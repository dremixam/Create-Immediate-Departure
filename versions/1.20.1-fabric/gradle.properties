# Minecraft
minecraft_version=1.20.1
# Compatibility declared in fabric.mod.json (Fabric predicate syntax); exact pin for this
# version, distinct from minecraft_version which also drives Loom's dependency resolution.
minecraft_version_range=1.20.1
pack_format=15
# 1.20.1 runs on Java 17; only 1.20.5+ requires Java 21.
java_version=17

# Fabric
loader_version=0.16.14
fabric_version=0.92.6+1.20.1

# Architectury API (multi-loader)
architectury_version=9.2.14

# No NeoForge node for this version: architectury-loom doesn't support NeoForge on 1.20.x
# (legacy SRG mappings, architectury-loom#289). Don't create a 1.20.1-neoforge node, it won't build.

# Create Fabric: https://modrinth.com/mod/create-fabric/versions. Pulls its own transitive
# dependencies (Porting Lib, Flywheel, Milk Lib, ...) through the loader-specific repos declared
# in build.gradle.kts.
create_version=6.0.8.1+build.1744-mc1.20.1

# Cloth Config + ModMenu: in-game configuration screen.
cloth_config_version=11.1.136
modmenu_version=7.2.2
