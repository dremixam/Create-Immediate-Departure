# Enables Loom's native NeoForge ceiling (distinct from architectury { neoForge() } in
# build.gradle.kts; both declarations are needed, one without the other isn't enough).
loom.platform=neoforge

# Minecraft
minecraft_version=1.21.1
pack_format=34
# Bounds of the neoforge.mods.toml compat range: exact pin for this version (mc_range_lower is
# distinct from minecraft_version, which also drives Loom's dependency resolution) up to the next
# major/minor version line.
mc_range_lower=1.21.1
mc_range_upper=1.22

# Architectury API (multi-loader)
architectury_version=13.0.11

# NeoForge
neoforge_version=21.1.248
neo_loader_version_range=[4,)

# Create NeoForge: https://wiki.createmod.net/developers/depend-on-create/neoforge-1.21.1.
# Unlike Create Fabric, dependencies here are not transitive; Ponder, Flywheel, and Registrate
# must all be declared explicitly (see build.gradle.kts).
create_version=6.0.10-280
ponder_version=1.0.82
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67

# Cloth Config: in-game configuration screen.
cloth_config_version=15.0.140
